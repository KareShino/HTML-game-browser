function itemProblem(id){const kind=ITEMS[id].kind;if(kind==='hp'&&player.hp===player.max)return 'HPは まんたん！';if(kind==='pp'&&player.pp.every((pp,i)=>pp===MOVES[SPECIES[player.id].moves[i]].pp))return 'PPは まんたん！';if(kind==='status'&&!player.par&&!player.confusion)return 'ようすは ふつう！';return ''}
function applyItem(id){switch(ITEMS[id].kind){case'hp':player.hp=Math.min(player.max,player.hp+100);break;case'pp':player.pp=player.pp.map((pp,i)=>Math.min(MOVES[SPECIES[player.id].moves[i]].pp,pp+5));break;case'status':player.par=false;player.confusion=0;break}}
function restoreAttempt(){if(checkpoint){player=structuredClone(checkpoint.player);money=checkpoint.money;inventory=[...checkpoint.inventory]}}
function retryBattle(){retries++;restoreAttempt();beginRound()}
function result(lost){state='result';locked=false;AudioSystem.mode(lost?'title':'win');AudioSystem.sfx(lost?'hit':'win');if(lost){screen.innerHTML=`<div class="intro"><span class="ticket">とちゅうげしゃ</span>${img(selected)}<h2>めのまえが まっくらに なった！</h2><p>${speech(enemy.id,'win')}</p><p>${speech(player.id,'lose')}</p><p>第 ${round+1} 戦 / ${battleTurns} ターン</p><p class="small">やりなおすと おかねと どうぐも<br>この しょうぶの はじめに もどるよ。</p><div class="actions">${btn('もういちど しょうぶ','retry','primary')}${round>0?btn('キオスクへ もどる','shopRetry'):''}${btn('なかまを えらびなおす','select')}</div></div>`}else{if(!rewarded.has(round)){lastReward=rewardFor(battleTurns,round);money+=lastReward;earned+=lastReward;rewarded.add(round)}const base=round===2?600:300,bonus=lastReward-base;screen.innerHTML=`<div class="intro"><span class="ticket">第 ${round+1} 戦 しょうり</span>${img(enemy.id)}<h2>${enemy.name}に かった！</h2><p>${speech(enemy.id,'lose')}</p><p>${speech(player.id,'win')}</p><div class="reward-box">${battleTurns} ターンで しょうり！<br>きほん ${base} G ＋ はやさ ${bonus} G<br><strong>${lastReward} G もらった！</strong></div><p>おかね　${money} G</p><p class="small">はやく たおすほど ボーナス！<br>HPと PPは キオスクで かいふくできるよ。</p>${btn('キオスクへ','shop','primary')}</div>`}bind()}
function openShop(retry=false,notice=''){state='shop';menu='main';locked=false;shopRetry=retry;route.textContent='キオスク';screen.innerHTML=`<div class="content kiosk"><h2 class="section-title">キオスク</h2><div class="shop-summary"><b>おかね　${money} G</b><span>${player.name}　HP ${player.hp} / ${player.max}${player.par?'　まひ':''}</span></div><p class="shop-notice" role="status">${notice||'いらっしゃい！ なにに する？'}</p><div class="shop-list"><div class="shop-row"><div><strong>かいふく サービス</strong><p>HP・PPを ぜんかいふく。<br>まひと こんらんも なおす。</p></div><button id="recover" ${money<200||player.hp===player.max&&player.pp.every((n,i)=>n===MOVES[SPECIES[player.id].moves[i]].pp)&&!player.par&&!player.confusion?'disabled':''}>200 G<br>やすむ</button></div>${ITEMS.map((it,i)=>`<div class="shop-row"><div><strong>${it.name}　×${inventory[i]}</strong><p>${it.desc}</p></div><button data-buy="${i}" ${money<it.cost?'disabled':''}>${it.cost} G<br>かう</button></div>`).join('')}</div><p class="small">どうぐは バトルでも つかえるよ。<br>かいふくは じどうでは されないよ。</p><div class="actions">${btn('もっている どうぐ','shopBag')}${btn(retry?'しょうぶに もどる':round===2?'けっかを みる':'つぎの しょうぶへ','shopNext','primary')}</div></div>`;bind();$('#recover').onclick=()=>{if(money<200||player.hp===player.max&&player.pp.every((n,i)=>n===MOVES[SPECIES[player.id].moves[i]].pp)&&!player.par&&!player.confusion)return;money-=200;player.hp=player.max;player.pp=SPECIES[player.id].moves.map(id=>MOVES[id].pp);player.par=false;player.confusion=0;AudioSystem.sfx('heal');openShop(shopRetry,'HPと PPが ぜんかいふくした！')};screen.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buy;if(money<ITEMS[i].cost)return;money-=ITEMS[i].cost;inventory[i]++;AudioSystem.sfx('select');openShop(shopRetry,ITEMS[i].name+'を かった！')})}
function shopBag(){menu='shopItems';const retry=shopRetry;screen.innerHTML=`<div class="content kiosk"><h2 class="section-title">もっている どうぐ</h2><p>${player.name}　HP ${player.hp} / ${player.max}</p><div class="bag-controls">${ITEMS.map((it,i)=>`<button data-shop-item="${i}" ${inventory[i]===0||itemProblem(i)?'disabled':''}>${it.name} ×${inventory[i]}<small>${it.desc}</small></button>`).join('')}<button id="shop-back">キオスクへ もどる</button></div></div>`;screen.querySelectorAll('[data-shop-item]').forEach(b=>b.onclick=()=>{const i=+b.dataset.shopItem;if(inventory[i]<=0||itemProblem(i))return;inventory[i]--;applyItem(i);AudioSystem.sfx('heal');shopBag()});$('#shop-back').onclick=()=>openShop(retry)}
function clearScreen(){state='clear';route.textContent='しょうぶ おしまい！';screen.innerHTML=`<div class="intro"><span class="ticket">しゅうてんに とうちゃく！</span><h2>${player.name}と<br>さいごまで かった！</h2>${img(selected)}<div class="stats"><div><b>${turns}</b><span>かかった ターン</span></div><div><b>${retries}</b><span>やりなおし</span></div><div><b>3 / 3</b><span>勝利</span></div><div><b>${earned} G</b><span>もらった おかね</span></div></div><p>ペンギン「おみごと！<br>でも さいようは まだ なんだ。」</p><p class="small muted">つづきは かいぎしつで！</p><div class="actions">${btn('べつの なかまで あそぶ','select','primary')}${btn('タイトルへ','title')}</div></div>`;bind()}
function modal(titleText,text,buttons){const o=$('#overlay');o.innerHTML=`<div class="modal-shade"><div class="modal" role="dialog" aria-modal="true" aria-label="${titleText}"><h2>${titleText}</h2><p>${text}</p><div class="actions">${buttons.map((b,i)=>`<button id="modal${i}" class="${i===buttons.length-1?'primary':''}">${b[0]}</button>`).join('')}</div></div></div>`;buttons.forEach((b,i)=>$(`#modal${i}`).onclick=()=>{o.innerHTML='';b[1]()});$('#modal0').focus()}
const actions={title,select:selection,start,fight:battle,next:()=>{round++;beginRound()},retry:retryBattle,shop:()=>openShop(false),shopRetry:()=>{retries++;restoreAttempt();openShop(true)},shopBag,shopNext:()=>{if(state!=='shop')return;if(shopRetry){beginRound()}else if(round===2){clearScreen()}else{round++;beginRound()}},bag:()=>{if(Engine.forced(player)){modal('いまは つかえない','まずは じぶんの ばんを すすめよう。',[['とじる',()=>{}]]);return}menu='items';renderCommands()},attack:()=>{if(Engine.forced(player))takeTurn(null);else{menu='moves';chosenMove=null;renderCommands()}},status:()=>modal('いまの ようす',`${player.name}　HP ${player.hp} / ${player.max}\n攻撃 ${player.atk}（${fmt(player.stages.atk)}） / 防御 ${player.def}（${fmt(player.stages.def)}）\n特殊 ${player.sp}（${fmt(player.stages.sp)}） / 素早さ ${player.speed}（${fmt(player.stages.speed)}）\nいまの すばやさ ${Math.floor(Engine.speed(player))}\nようす：${[player.par?'まひ':'',player.confusion?'混乱 残り'+player.confusion+'行動':'',player.focus?'しゅうちゅう':'',player.recharge?'つぎは ひとやすみ':'',player.dig!==null?'ちちゅう・つぎに こうげき':''].filter(Boolean).join(' / ')||'ふつう'}\n\nみるだけなら ターンは すすまない。`,[['とじる',()=>{}]]),escape:()=>modal('しょうぶを やめますか？','タイトルに もどると はじめからに なるよ。',[['つづける',()=>{}],['タイトルへ',title]])};function fmt(n){return(n>=0?'+':'')+n+'段階'}for(let i=0;i<3;i++)actions['pick'+i]=()=>{selected=i;AudioSystem.sfx('select');renderSelection()};
$('#mute').onclick=()=>{firstGesture=false;AudioSystem.toggle()};$('#volume').oninput=e=>AudioSystem.volume(+e.target.value/100);
document.addEventListener('pointerdown',e=>{if(firstGesture&&e.target.id!=='mute'&&e.target.id!=='volume'){firstGesture=false;AudioSystem.start()}},{passive:true});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const key=e.key.toLowerCase(),decide=['enter','z',' '].includes(key),back=['escape','x','backspace'].includes(key);if(!decide&&!back&&!key.startsWith('arrow'))return;e.preventDefault();if(e.repeat&&decide)return;if(firstGesture){firstGesture=false;AudioSystem.start()}if(locked){if(decide)advance?.();return}if(decide&&document.activeElement?.id==='mute'){$('#mute').click();return}const modalEl=$('.modal');if(back){if(modalEl){$('#overlay').innerHTML='';return}if(state==='shop'&&menu==='shopItems'){openShop(shopRetry);return}if(state==='battle'&&(menu==='moves'||menu==='items')){menu='main';renderCommands()}else if(state==='select')title();return}const root=modalEl||screen,buttons=[...root.querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;let idx=buttons.indexOf(document.activeElement);if(decide){(idx>=0?buttons[idx]:buttons[0]).click();return}const shift=['arrowright','arrowdown'].includes(key)?1:-1;buttons[(idx+shift+buttons.length)%buttons.length].focus()});
window.TouchBattle={Engine,MOVES,SPECIES,Sprite,DIALOGUE,getState:()=>({state,selected,round,retries,turns,battleTurns,player,enemy,locked,menu,turnLog,money,earned,inventory:[...inventory],lastReward,shopRetry}),rewardFor,ITEMS,setFast:v=>delayScale=v};title();

// 画面の高さが足りないときは全体を縮小して、スクロールなしで収める（幅550px以下の縦持ちは従来どおり）
(function(){var app=document.querySelector('.app');if(!app)return;
function fit(){app.style.transform='';app.style.height='';if(innerWidth<=550)return;
var h=app.offsetHeight,k=Math.max(.5,Math.min(1,(innerHeight-2)/h));
if(k<1){app.style.transformOrigin='top center';app.style.transform='scale('+k+')';app.style.height=(h*k)+'px';}}
addEventListener('resize',fit);if(window.ResizeObserver){var ro=new ResizeObserver(fit);Array.prototype.forEach.call(app.children,function(c){ro.observe(c);});}fit();})();
</script>
